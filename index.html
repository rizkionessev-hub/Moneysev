<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f35c9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Moneysev</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#e8ecfb;--tx:#14183a;--mu:#5d648a;--pr:#2f35c9;--ln:rgba(120,130,190,.25);--ng:#d63a5c;--ok:#0f9d68;--bar:rgba(120,130,190,.22);--glass:rgba(255,255,255,.5);--edge:rgba(255,255,255,.75);--hi:rgba(255,255,255,.95);--field:rgba(255,255,255,.55);--sh:0 10px 30px rgba(60,70,160,.16);--blob:.65;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c1c;--tx:#eceefb;--mu:#a0a6cc;--pr:#9ba0ff;--ln:rgba(160,170,255,.18);--ng:#ff7b97;--ok:#3ddc9b;--bar:rgba(160,170,255,.2);--glass:rgba(30,34,78,.5);--edge:rgba(255,255,255,.14);--hi:rgba(255,255,255,.22);--field:rgba(255,255,255,.08);--sh:0 10px 30px rgba(0,0,0,.4);--blob:.4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0c1c;--tx:#eceefb;--mu:#a0a6cc;--pr:#9ba0ff;--ln:rgba(160,170,255,.18);--ng:#ff7b97;--ok:#3ddc9b;--bar:rgba(160,170,255,.2);--glass:rgba(30,34,78,.5);--edge:rgba(255,255,255,.14);--hi:rgba(255,255,255,.22);--field:rgba(255,255,255,.08);--sh:0 10px 30px rgba(0,0,0,.4);--blob:.4;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;opacity:var(--blob);background:radial-gradient(40% 35% at 15% 10%,#7aa2ff,transparent 70%),radial-gradient(35% 30% at 90% 20%,#c58bff,transparent 70%),radial-gradient(40% 35% at 70% 90%,#6fe3d0,transparent 70%),radial-gradient(30% 30% at 10% 85%,#ffb3d1,transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.12) rotate(5deg)}}
#wrap{max-width:480px;margin:0 auto;padding:14px 16px 170px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
#ctl{display:flex;gap:6px}
h1{font-size:20px;font-weight:800;margin:0}
.glass,.card,nav,.sheet>div,.plus{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),var(--sh)}
select,input{font:inherit;color:var(--tx);background:var(--field);border:1px solid var(--edge);border-radius:14px;padding:9px 10px;width:100%;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:box-shadow .2s}
input:focus,select:focus{outline:0;box-shadow:0 0 0 3px rgba(90,99,255,.35)}
#ctl select{width:auto;font-weight:600;border-radius:20px}
.card{border-radius:24px;padding:14px;margin-bottom:12px}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,rgba(60,66,215,.88),rgba(130,80,235,.82));border-color:rgba(255,255,255,.4);border-radius:28px;padding:18px}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 70% at 8% 0%,rgba(255,255,255,.38),transparent 55%)}
.hero small{opacity:.88}.big{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:2px 0 12px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mu{color:var(--mu);font-size:13px}.neg{color:var(--ng)}.pos{color:var(--ok)}
.bar{height:10px;background:var(--bar);border-radius:10px;overflow:hidden;margin:7px 0}
.hero .bar{background:rgba(255,255,255,.28);height:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6a72ff,#a77bff);border-radius:10px}.hero .bar i{background:#fff}.bar i.ov{background:var(--ng)}
h2{font-size:15px;font-weight:800;margin:0 0 4px}
.sub{font-size:12px;color:var(--mu);margin-bottom:8px}
.item{padding:10px 0;border-top:1px solid var(--ln)}.item.f{border-top:0}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:9px 14px;background:linear-gradient(180deg,#6a72ff,#3238d4);color:#fff;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s,opacity .2s}
button:active{transform:scale(.94)}
button.g{background:transparent;color:var(--mu);padding:4px 8px;box-shadow:none}
button.gl{background:var(--field);color:var(--tx);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi)}
button.w{width:100%;margin-top:10px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));display:flex;gap:4px;padding:6px;border-radius:32px;z-index:5}
nav button{flex:1;background:none;color:var(--mu);border-radius:26px;padding:11px 4px;font-size:13px;box-shadow:none;transition:background .3s,color .3s,transform .15s}
nav button.on{color:var(--pr);background:var(--field);box-shadow:inset 0 1px 0 var(--hi),0 2px 10px rgba(60,70,160,.15)}
.plus{position:fixed;left:0;right:0;margin:0 auto;width:60px;height:60px;border-radius:50%;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:6;color:#fff;font-size:32px;line-height:1;padding:0;background:linear-gradient(145deg,rgba(110,118,255,.95),rgba(60,66,215,.9));animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.plus:active{animation:none;transform:scale(.9)}
.sheet{position:fixed;inset:0;background:rgba(10,12,30,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:fade .25s}
.sheet>div{width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:30px 30px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;animation:pop .4s cubic-bezier(.2,.9,.3,1.1)}
.sheet img{width:100%;border-radius:16px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(50px)}}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes grow{from{transform:scaleX(0)}}
.enter>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.enter>:nth-child(2){animation-delay:.07s}.enter>:nth-child(3){animation-delay:.14s}.enter>:nth-child(n+4){animation-delay:.21s}
.enter .bar i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) .2s both}
.tog{display:flex;gap:8px}.tog button{flex:1;background:var(--field);color:var(--mu);box-shadow:none}.tog button.on{background:linear-gradient(180deg,#6a72ff,#3238d4);color:#fff}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:9px;background:var(--bar);color:var(--mu)}.chip.ok{background:var(--ok);color:#fff}
.val{background:var(--field);border-radius:16px;padding:10px 12px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*,::before{animation:none!important;transition:none!important}}
</style></head><body>
<div id="wrap">
<header><div><h1>Moneysev</h1><div class="mu" id="sub"></div></div>
<div id="ctl"><select id="ms" onchange="S.m=+this.value;AN=1;go()"></select><select id="ys" onchange="S.y=+this.value;AN=1;go()"></select></div></header>
<div id="app"></div></div>
<button class="plus" id="plus" onclick="openM()" aria-label="Catat transaksi">+</button>
<nav id="nav"></nav>
<div id="modal"></div>
<script>
const MN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const KEY="moneysev-v2",$=s=>document.querySelector(s);
const rp=n=>(n<0?"-":"")+"Rp"+Math.abs(Math.round(n)).toLocaleString("id-ID");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=a=>a.reduce((s,t)=>s+t.v,0),pad=n=>String(n).padStart(2,"0");
const lt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmt=ts=>new Date(ts).toLocaleString("id-ID",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}).replace(/(\d)\.(\d)/,"$1:$2");
const stamp=ts=>{const d=new Date(ts);return{ts,m:d.getMonth(),y:d.getFullYear()}};
const mk=n=>({id:Date.now(),name:n,m:0,y:2026,tab:"home",target:5000000,accs:["Cash"],open:{},bud:[],gold:{g:0,p:2224},rd:{u:0,nab:2000},loans:[],tx:[]});
let R=null,S=null,T="out",E=0,AN=1,PH=null;
try{R=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!R){R={ds:[]};try{const o=JSON.parse(localStorage.getItem("moneysev-v1"));
 if(o&&o.accs){o.name="Utama";o.id=1;o.tab="home";if(o.gold&&o.gold.p>100000)o.gold.p/=1000;delete o.demo;R.ds.push(o)}}catch(e){}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};
const opts=(l,sel)=>l.map(a=>`<option ${a==sel?"selected":""}>${esc(a)}</option>`).join("");
const DB=()=>new Promise((ok,no)=>{const q=indexedDB.open("moneysev-img",1);q.onupgradeneeded=()=>q.result.createObjectStore("p");q.onsuccess=()=>ok(q.result);q.onerror=no});
const ph=async(m,k,v)=>{try{const s=(await DB()).transaction("p",m=="get"?"readonly":"readwrite").objectStore("p"),r=m=="get"?s.get(k):m=="put"?s.put(v,k):s.delete(k);return await new Promise(ok=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}};
const inM=(t,D)=>t.m==D.m&&(t.y||2026)==D.y;
function C(D){D=D||S;
 const bal={};D.accs.forEach(a=>bal[a]=D.open[a]||0);
 D.tx.forEach(t=>{if(bal[t.acc]!==undefined)bal[t.acc]+=t.type=="in"?t.v:-t.v});
 const liq=D.accs.reduce((s,a)=>s+bal[a],0),gold=D.gold.g*1000*D.gold.p,rd=D.rd.u*D.rd.nab,non=gold+rd,aset=liq+non;
 const mt=D.tx.filter(t=>inM(t,D)&&!t.ln),inc=sum(mt.filter(t=>t.type=="in")),outs=mt.filter(t=>t.type=="out"),exp=sum(outs);
 const rows=D.bud.map(b=>{const r=sum(outs.filter(t=>t.cat==b.n));return{...b,r,s:b.a-r}});
 const nm=D.bud.map(b=>b.n),out=sum(outs.filter(t=>!nm.includes(t.cat))),sur=inc-exp;let est;
 if(aset>=D.target)est="Target tercapai";else if(sur<=0)est="Pemasukan kurang";else est=Math.ceil((D.target-aset)/sur)+" bulan lagi";
 const sisa=l=>l.v-l.paid,H=D.loans.filter(l=>l.t=="h"),P=D.loans.filter(l=>l.t=="p");
 return{bal,liq,gold,rd,non,aset,mt,inc,exp,rows,out,sur,est,H,P,hs:H.reduce((s,l)=>s+sisa(l),0),ps:P.reduce((s,l)=>s+sisa(l),0)}}
function pick(){
 const cs=R.ds.map(d=>({d,c:C(d)})),tot=cs.reduce((s,x)=>s+x.c.aset,0);
 return `<div class="card hero"><small>Total uang keseluruhan</small><div class="big">${rp(tot)}</div><small>${R.ds.length} dompet</small></div>
 <div class="card"><h2>Pilih dompet</h2><div class="sub">Ketuk dompet untuk masuk.</div>
 ${cs.map((x,i)=>`<div class="item row" style="cursor:pointer" onclick="enter(${i})"><div><b>${esc(x.d.name)}</b><div class="mu">Saldo ${rp(x.c.liq)}</div></div>
 <div style="text-align:right"><b>${rp(x.c.aset)}</b><div class="mu">total uang</div><button class="g" onclick="event.stopPropagation();askDel(${i})">Hapus</button></div></div>`).join("")||`<div class="mu">Belum ada dompet. Buat yang pertama di bawah.</div>`}
 <div class="f2" style="margin-top:10px"><input id="dn" placeholder="Contoh: Multimedia"><button onclick="addD()">Buat dompet</button></div></div>`}
function enter(i){S=R.ds[i];S.tab="home";const n=new Date();S.m=n.getMonth();S.y=n.getFullYear();AN=1;go()}
function addD(){const n=$("#dn").value.trim();if(!n||R.ds.some(d=>d.name==n))return;R.ds.push(mk(n));AN=1;go()}
function askDel(i){sheet(`<b>Hapus dompet ${esc(R.ds[i].name)}?</b><div class="mu">Semua akun, transaksi, dan hutang di dalamnya ikut terhapus.</div><button style="background:var(--ng)" onclick="R.ds.splice(${i},1);closeM();go()">Hapus dompet</button><button class="g" onclick="closeM()">Batal</button>`)}
function home(c){
 const p=Math.max(0,Math.min(100,c.aset/S.target*100)),l=S.tx.filter(t=>inM(t,S)).sort((a,b)=>(b.ts||b.id)-(a.ts||a.id));
 return `<div class="card hero"><small>Total aset</small><div class="big">${rp(c.aset)}</div>
 <div class="row"><small>Liquid Assets<br><b>${rp(c.liq)}</b></small><small style="text-align:right">Non Liquid Assets<br><b>${rp(c.non)}</b></small></div>
 <div class="row" style="margin-top:14px"><small>Target ${rp(S.target)}</small><small>${p.toFixed(0)}%</small></div>
 <div class="bar"><i style="width:${p}%"></i></div><small>Estimasi tercapai: <b>${c.est}</b></small></div>
 <div class="card"><div class="row"><div><div class="mu">Pemasukan ${MN[S.m]}</div><b class="pos">${rp(c.inc)}</b></div>
 <div><div class="mu">Pengeluaran</div><b class="neg">${rp(c.exp)}</b></div><div><div class="mu">Sisa</div><b>${rp(c.sur)}</b></div></div></div>
 <div class="card"><h2>Riwayat ${MN[S.m]} ${S.y}</h2>${l.length?l.map(t=>`<div class="item row"><div><b>${esc(t.d)}</b><div class="mu">${fmt(t.ts||t.id)}</div><div class="mu">${esc(t.acc)}${t.cat?" · "+esc(t.cat):""}${t.ph?` · <a href="#" style="color:var(--pr)" onclick="showPh(${t.id});return false">Lihat foto</a>`:""}</div></div>
 <div style="text-align:right"><b class="${t.type=="in"?"pos":"neg"}">${t.type=="in"?"+":"-"}${rp(t.v)}</b><br><button class="g" onclick="del(${t.id})">Hapus</button></div></div>`).join(""):`<div class="mu" style="margin-top:8px">Belum ada transaksi bulan ini. Ketuk tombol + untuk mencatat.</div>`}</div>`}
function bud(c){
 return `<div class="card"><div class="row"><h2>Anggaran ${MN[S.m]} ${S.y}</h2><button class="g" onclick="E=!E;go()">${E?"Selesai":"Atur"}</button></div>
 ${c.rows.length?"":`<div class="mu">Belum ada kategori. Ketuk Atur untuk menambah.</div>`}
 ${c.rows.map((b,i)=>{const q=b.a?b.r/b.a*100:0;return `<div class="item"><div class="row"><b>${esc(b.n)}</b>${E?`<span><input type="number" inputmode="numeric" style="width:110px" value="${b.a}" onchange="S.bud[${i}].a=+this.value;go()"> <button class="g" onclick="S.bud.splice(${i},1);go()">Hapus</button></span>`:`<span class="mu">${rp(b.r)} / ${rp(b.a)}</span>`}</div>
 <div class="bar"><i class="${b.r>b.a?"ov":""}" style="width:${Math.min(100,q)}%"></i></div><div class="mu">Sisa anggaran ${rp(b.s)}</div></div>`}).join("")}
 ${E?`<div class="f2" style="margin-top:8px"><input id="bn" placeholder="Nama kategori"><input id="ba" type="number" inputmode="numeric" placeholder="Anggaran"></div><button class="w" onclick="addB()">Tambah kategori</button>`:""}
 <div class="item row"><b>Di luar anggaran</b><span class="${c.out?"neg":"mu"}">${rp(c.out)}</span></div>
 <div class="item row"><span class="mu">Rata-rata pengeluaran harian</span><b>${rp(c.exp/30)}</b></div></div>`}
function harta(c){
 const gs=S.gold.g.toLocaleString("id-ID",{maximumFractionDigits:4});
 return `<div class="row" style="margin-bottom:12px"><div><div class="mu">Dompet aktif</div><b>${esc(S.name)}</b></div><button onclick="S=null;AN=1;go()">Ganti dompet</button></div>
 <div class="card"><div class="row"><h2>Liquid Assets</h2><b>${rp(c.liq)}</b></div><div class="sub">Uang yang bisa langsung dipakai: akun, rekening, e-wallet.</div>
 ${S.accs.map((a,i)=>`<div class="item f row"><div><b>${esc(a)}</b><div class="mu">Saldo awal <input type="number" inputmode="numeric" style="width:120px;padding:4px 8px" value="${S.open[a]||0}" onchange="S.open[S.accs[${i}]]=+this.value;go()"></div></div>
 <div style="text-align:right"><b>${rp(c.bal[a])}</b>${S.tx.some(t=>t.acc==a)||S.loans.some(l=>l.acc==a)?"":`<br><button class="g" onclick="S.accs.splice(${i},1);go()">Hapus</button>`}</div></div>`).join("")}
 <div class="f2" style="margin-top:8px"><input id="an" placeholder="Akun baru, mis. BRI"><button onclick="addA()">Tambah akun</button></div></div>
 <div class="card"><div class="row"><h2>Non Liquid Assets</h2><b>${rp(c.non)}</b></div><div class="sub">Aset yang perlu dijual dulu sebelum jadi uang: emas dan reksa dana.</div>
 <b>Emas</b><div class="val row"><span class="mu">Jumlah ${gs} g<br>Nilai jual</span><b>${rp(c.gold)}</b></div>
 <div class="f2"><div><label>Jumlah emas (gram)</label><input type="number" step="any" value="${S.gold.g}" onchange="S.gold.g=+this.value;go()"></div><div><label>Harga jual per 0,001 g</label><input type="number" step="any" value="${S.gold.p}" onchange="S.gold.p=+this.value;go()"></div></div>
 <div class="mu" style="margin-top:4px">Sama dengan ${rp(S.gold.p*1000)} per gram</div>
 <b style="display:block;margin-top:14px">Reksa Dana</b><div class="val row"><span class="mu">Nilai (unit × NAB)</span><b>${rp(c.rd)}</b></div>
 <div class="f2"><div><label>Jumlah unit</label><input type="number" step="any" value="${S.rd.u}" onchange="S.rd.u=+this.value;go()"></div><div><label>NAB sekarang</label><input type="number" step="any" value="${S.rd.nab}" onchange="S.rd.nab=+this.value;go()"></div></div></div>
 <div class="card"><h2>Target tabungan</h2><input type="number" value="${S.target}" onchange="S.target=+this.value;go()"></div>`}
function list(l,pay){return l.length?l.map(x=>{const s=x.v-x.paid;return `<div class="item"><div class="row"><b>${esc(x.n)}</b><span>${s<=0?`<span class="chip ok">Lunas</span>`:`<b>${rp(s)}</b>`}</span></div>
 <div class="row"><span class="mu">Total ${rp(x.v)}${x.paid&&s>0?" · terbayar "+rp(x.paid):""}${x.due?" · "+esc(x.due):""}</span><span>${s>0?`<button class="g" onclick="openP(${x.id})">${pay}</button>`:""}<button class="g" onclick="delL(${x.id})">Hapus</button></span></div></div>`}).join(""):`<div class="mu">Belum ada.</div>`}
function hutang(c){
 return `<div class="card"><div class="row"><div><div class="mu">Hutang (kamu yang bayar)</div><b class="neg">${rp(c.hs)}</b></div><div style="text-align:right"><div class="mu">Pinjaman (orang bayar ke kamu)</div><b class="pos">${rp(c.ps)}</b></div></div></div>
 <div class="card"><h2>Hutang / Cicilan</h2><div class="sub">Uang yang kamu pinjam dari orang lain.</div>${list(c.H,"Bayar")}</div>
 <div class="card"><h2>Pinjaman</h2><div class="sub">Uang kamu yang dipinjam orang lain.</div>${list(c.P,"Terima")}</div>
 <div class="card"><h2>Tambah catatan</h2><div class="f2"><div><label>Jenis</label><select id="lt"><option value="h">Hutang (aku pinjam)</option><option value="p">Pinjaman (aku meminjamkan)</option></select></div><div><label>Nama</label><input id="ln" placeholder="Nama"></div>
 <div><label>Jumlah</label><input id="lv" type="number" inputmode="numeric"></div><div><label>Jatuh tempo</label><input id="ld" placeholder="Contoh: Segera"></div></div>
 <label style="margin-top:10px">Akun (hutang: uang masuk · pinjaman: uang keluar)</label><select id="la"><option value="">Jangan ubah saldo</option>${opts(S.accs)}</select>
 <button class="w" onclick="addL()">Simpan</button></div>`}
const TABS=[["home","Home",home],["bud","Anggaran",bud],["hu","Hutang",hutang],["as","Harta",harta]];
function go(){save();const pk=!S;
 $("#ctl").style.display=$("nav").style.display=$("#plus").style.display=pk?"none":"";$("#sub").textContent=pk?"":S.name;
 if(!pk){const ys=[...new Set(Array.from({length:12},(_,i)=>2024+i).concat(S.y))].sort();
  $("#ms").innerHTML=MN.map((n,i)=>`<option value="${i}" ${i==S.m?"selected":""}>${n}</option>`).join("");
  $("#ys").innerHTML=ys.map(y=>`<option ${y==S.y?"selected":""}>${y}</option>`).join("");
  $("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]==S.tab?"on":""}" onclick="S.tab='${t[0]}';AN=1;go()">${t[1]}</button>`).join("")}
 const a=$("#app");a.innerHTML=pk?pick():TABS.find(t=>t[0]==S.tab)[2](C());
 if(AN){a.classList.remove("enter");void a.offsetWidth;a.classList.add("enter");AN=0}}
const sheet=h=>$("#modal").innerHTML=`<div class="sheet" onclick="if(event.target==this)closeM()"><div>${h}</div></div>`;
function closeM(){$("#modal").innerHTML="";PH=null}
function openM(){const cats=[...S.bud.map(b=>b.n),"Di luar anggaran"],d0=$("#td")?$("#td").value:"",v0=$("#tv")?$("#tv").value:"";
 sheet(`<div class="tog"><button class="${T=="out"?"on":""}" onclick="T='out';openM()">Pengeluaran</button><button class="${T=="in"?"on":""}" onclick="T='in';openM()">Pemasukan</button></div>
 <div><label>Keterangan</label><input id="td" value="${esc(d0)}" placeholder="Contoh: Makan siang"></div>
 <div class="f2"><div><label>Jumlah</label><input id="tv" type="number" inputmode="numeric" value="${esc(v0)}"></div><div><label>Akun</label><select id="ta">${opts(S.accs)}</select></div></div>
 ${T=="out"?`<div><label>Kategori anggaran</label><select id="tc">${opts(cats)}</select></div>`:""}
 <div><label>Tanggal &amp; jam</label><input id="tw" type="datetime-local" value="${lt(new Date())}"></div>
 <div><label>Foto nota (opsional)</label><div class="f2"><button class="gl" onclick="$('#fc').click()">Ambil foto</button><button class="gl" onclick="$('#fg').click()">Dari galeri</button></div>
 <input id="fc" type="file" accept="image/*" capture="environment" hidden onchange="pickPh(this.files[0])"><input id="fg" type="file" accept="image/*" hidden onchange="pickPh(this.files[0])">
 <div id="pv2" style="margin-top:8px">${PH?`<img src="${PH}">`:""}</div></div><button onclick="addT()">Simpan</button>`)}
function pickPh(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);PH=c.toDataURL("image/jpeg",.65);$("#pv2").innerHTML=`<img src="${PH}">`};im.src=r.result};r.readAsDataURL(f)}
async function addT(){const v=+$("#tv").value;if(!v||v<=0){$("#tv").focus();return}
 const dt=new Date($("#tw").value),ts=isNaN(dt)?Date.now():dt.getTime(),id=Date.now();
 const t={id,...stamp(ts),type:T,d:$("#td").value.trim()||(T=="in"?"Pemasukan":"Pengeluaran"),v,acc:$("#ta").value,cat:T=="out"?$("#tc").value:""};
 if(PH){await ph("put",S.id+"-"+id,PH);t.ph=1}
 S.tx.push(t);S.m=t.m;S.y=t.y;closeM();go()}
function showPh(id){ph("get",S.id+"-"+id).then(u=>u?sheet(`<img src="${u}"><button class="gl" onclick="closeM()">Tutup</button>`):sheet(`<div class="mu">Foto tidak ditemukan.</div><button class="gl" onclick="closeM()">Tutup</button>`))}
function del(id){const t=S.tx.find(x=>x.id==id);if(t&&t.ph)ph("del",S.id+"-"+id);S.tx=S.tx.filter(x=>x.id!=id);go()}
function addA(){const n=$("#an").value.trim();if(!n||S.accs.includes(n))return;S.accs.push(n);go()}
function addB(){const n=$("#bn").value.trim();if(!n||S.bud.some(b=>b.n==n))return;S.bud.push({n,a:+$("#ba").value||0});go()}
function addL(){const n=$("#ln").value.trim(),v=+$("#lv").value,t=$("#lt").value,a=$("#la").value;if(!n||!v)return;
 const id=Date.now();S.loans.push({id,t,n,v,paid:0,due:$("#ld").value.trim(),acc:a});
 if(a)S.tx.push({id:id+1,lid:id,ln:1,...stamp(id),type:t=="h"?"in":"out",d:(t=="h"?"Hutang dari ":"Pinjaman ke ")+n,v,acc:a,cat:""});go()}
function delL(id){S.loans=S.loans.filter(l=>l.id!=id);S.tx=S.tx.filter(t=>t.lid!=id);go()}
function openP(id){const l=S.loans.find(x=>x.id==id),h=l.t=="h";
 sheet(`<b>${h?"Bayar hutang":"Terima pembayaran"}: ${esc(l.n)}</b><div class="mu">Sisa ${rp(l.v-l.paid)}</div>
 <div class="f2"><div><label>Jumlah</label><input id="pv" type="number" inputmode="numeric" value="${l.v-l.paid}"></div><div><label>${h?"Dari akun":"Ke akun"}</label><select id="pa">${opts(S.accs,l.acc)}</select></div></div>
 <button onclick="payL(${id})">Simpan</button>`)}
function payL(id){const l=S.loans.find(x=>x.id==id),h=l.t=="h";let v=+$("#pv").value;if(!v||v<=0)return;v=Math.min(v,l.v-l.paid);l.paid+=v;
 S.tx.push({id:Date.now(),lid:id,ln:h?0:1,...stamp(Date.now()),type:h?"out":"in",d:(h?"Bayar ":"Terima dari ")+l.n,v,acc:$("#pa").value,cat:h?"Bayar Cicilan":""});closeM();go()}
go();
</script>
